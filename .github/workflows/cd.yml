name: CD

# Runs after CI succeeds on main: publishes images to GitHub Container Registry,
# then triggers the hosting platform's deploy hooks if they are configured.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ai-service, client]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mediconnect-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/mediconnect-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      AI_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_AI }}
      CLIENT_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}
    steps:
      - name: Trigger deploys
        run: |
          deployed=0
          for hook in "$AI_HOOK" "$API_HOOK" "$CLIENT_HOOK"; do
            if [ -n "$hook" ]; then curl -fsS -X POST "$hook" > /dev/null && deployed=$((deployed+1)); fi
          done
          echo "Triggered $deployed deploy hook(s). Add RENDER_DEPLOY_HOOK_* secrets to enable automatic deploys."
